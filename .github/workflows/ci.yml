name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextjs_rfs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextjs_rfs_ci?schema=public
      JWT_SECRET: ci-only-secret-not-for-real-use
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3501
      NEXT_PUBLIC_API_URL: http://localhost:3501/api
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed minimal CI fixtures
        run: npx tsx prisma/seed-ci.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # continue-on-error: next/react/sharp/postcss are all fully upgraded now
      # (see document/dependency-upgrade-plan.md, Stages 0-3) and no longer carry any
      # advisory. What's left is unrelated: @prisma/config/prisma depend on a vulnerable
      # deepmerge-ts (GHSA-ggr8-5vv4-36mx) with no fix available on the stable channel
      # (only a Prisma 6 downgrade or an unreleased Prisma 8 RC clear it - see
      # 00-progress.md ของค้าง #9). Kept non-blocking until Prisma ships a real fix;
      # still visible in logs on every run so it isn't silently ignored.
      - name: Audit dependencies (high+ severity)
        run: npm audit --audit-level=high
        continue-on-error: true
